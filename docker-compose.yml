version: "3.8"
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  ai:
    build:
      context: .
    depends_on:
      - mongo
    ports:
      - "4001:4001"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: "4001"
      USE_PRETTY_LOGS: "true"
      MONGODB_URI: mongodb://mongo:27017/pinntag_ai
      BACKEND_MONGODB_URI: mongodb://mongo:27017/pinntagPreProduction
      # If ETL runs on host machine, use host.docker.internal (macOS/Windows)
      ETL_BASE_URL: http://host.docker.internal:8000/api/v1

volumes:
  mongo_data:
